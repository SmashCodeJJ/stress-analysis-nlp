name: Stress Analysis CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  train-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm

      - name: Download dataset
        run: python scripts/download_dataset.py

      - name: Run stress analysis pipeline
        run: python run_stress_analysis.py

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-comparison-results
          path: results/model_comparison.json
